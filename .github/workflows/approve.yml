name: approve
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  pull-requests: write
  contents: read
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr review "${{ inputs.pr }}" --approve --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
